apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: saikotgirep/frontend:main-INIT
        ports:
        - containerPort: 80
